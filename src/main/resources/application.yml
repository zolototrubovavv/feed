spring:
  application:
    name: feed
  datasource:
    url: jdbc:postgresql://localhost:5432/feed
    username: feed_user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/000-db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/feed-realm
  kafka:
    bootstrap-servers: localhost:9092
    # topics:
    #   auto-create: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Сразу превращаем Java-объекты в JSON при отправке:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000
    consumer:
      group-id: news-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.github.zolototrubovavv.*"
    admin:
      properties:
        request.timeout.ms: 1000
        default.api.timeout.ms: 1000
    listener:
      concurrency: 3
  data:
    redis:
      host: host.docker.internal
      port: 6379
logging:
  level:
    root: INFO
    com.github.zolototrubovavv: DEBUG
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.springframework.boot.autoconfigure: INFO
    liquibase: WARN
    org.zalando.logbook: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/app.log
kafka-topics:
  news-events: news-events
  partitions: 3
  replicas: 2
logbook:
  format.style: http
  write.max-body-size: 4096
  predicate:
    exclude:
    # - path: "${management.server.port}${management.endpoints.web.base-path}**"
    - path: "/swagger**"
    - path: "/v3/**"
    - path: "/api-docs**"
    - path: "/swagger-ui**"
