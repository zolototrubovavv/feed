spring:
  application:
    name: feed
  datasource:
    url: jdbc:postgresql://localhost:5432/feed
    username: feed_user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/000-db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/news-realm
  kafka:
    bootstrap-servers: localhost:9092
    # topics:
    #   auto-create: true
    consumer:
      group-id: news-consumer-group
      auto-offset-reset: earliest
  data:
    redis:
      host: host.docker.internal
      port: 6379
logging:
  level:
    root: INFO
    com.github.zolototrubovavv: DEBUG
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.springframework.boot.autoconfigure: INFO
    liquibase: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/app.log
    max-size: 10MB
    max-history: 7
